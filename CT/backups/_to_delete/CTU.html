<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f2" id="theme-color" />
    <meta
      name="description"
      content="Local speedcubing timer, solve library, and statistics."
    />
    <title>CubeTracker</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%232c5546'/%3E%3Cpath d='m20 8 11 6v12l-11 6-11-6V14zm0 12 11-6M20 20 9 14m11 6v12' fill='none' stroke='%23e2ee98' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="assets/style.css" />
    <script defer src="assets/core.js"></script>
    <script defer src="assets/app.js"></script>
  </head>
  <body>
    <div class="app-layout">
      <div id="sidebar-hotzone" class="sidebar-hotzone" aria-hidden="true"></div>
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#overview" aria-label="CubeTracker home"
          ><span class="brandmark" data-icon="cube"></span
          ><span>cubetracker<span class="brand-dot">.</span></span></a
        >
        <nav class="main-nav" aria-label="Main navigation">
          <button data-view="overview" class="nav-item active">
            <span data-icon="grid"></span>Overview
          </button>
          <button data-view="timer" class="nav-item">
            <span data-icon="timer"></span>Timer<span class="nav-key">T</span>
          </button>
          <button data-view="solves" class="nav-item">
            <span data-icon="list"></span>Solve library
          </button>
          <button data-view="insights" class="nav-item">
            <span data-icon="chart"></span>Insights
          </button>
        </nav>
        <div class="category-heading">
          <span>CATEGORIES</span
          ><button
            class="icon-btn"
            data-action="category"
            aria-label="New category"
            title="New category"
          >
            <span data-icon="plus"></span>
          </button>
        </div>
        <div id="category-list" class="category-list"></div>
        <button class="add-category" data-action="category">
          <span data-icon="plus"></span>New category
        </button>
        <div class="sidebar-bottom">
          <button class="nav-item" data-action="theme" id="theme-btn">
            <span data-icon="moon"></span
            ><span class="theme-label">Dark mode</span>
          </button>
          <button class="nav-item" data-action="settings">
            <span data-icon="settings"></span>Settings
          </button>
          <button class="nav-item" data-action="help">
            <span data-icon="help"></span>Guide & shortcuts
          </button>
          <button
            class="icon-btn mobile-storage"
            data-action="storage"
            aria-label="Storage"
          >
            <span data-icon="folder"></span>
          </button>
          <div class="storage-state">
            <span id="storage-dot" class="status-dot"></span>
            <div>
              <strong id="storage-label">Loading</strong
              ><span id="storage-detail"></span>
            </div>
            <button class="icon-btn" data-action="storage" aria-label="Storage">
              <span data-icon="arrow-up-right"></span>
            </button>
          </div>
        </div>
      </aside>
      <div class="main-shell">
        <header class="topbar">
          <div class="breadcrumb">
            <strong id="page-label">Overview</strong>
          </div>
          <div class="top-actions">
            <button class="btn btn-quiet" data-action="import">
              <span data-icon="upload"></span>Import CSV</button
            ><button class="btn btn-dark" data-action="practice">
              <span data-icon="play"></span>Timer
            </button>
          </div>
        </header>
        <main id="main" tabindex="-1"></main>
        <footer class="footer">
          <span id="footer-meta"></span>
        </footer>
      </div>
    </div>
    <div id="sidebar-scrim" class="sidebar-scrim" aria-hidden="true"></div>
    <input id="file-input" type="file" accept=".csv,text/csv" hidden />
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div id="dialog-content"></div>
    </dialog>
    <div
      id="toast-region"
      class="toast-region"
      aria-live="polite"
      aria-atomic="false"
    ></div>
    <div id="chart-tooltip" class="chart-tooltip" hidden></div>
  </body>
</html>

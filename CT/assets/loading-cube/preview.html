<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cube loading preview</title>
<link rel="stylesheet" href="../style.css">
<style>
body{min-height:100vh;display:grid;place-content:center;gap:24px;text-align:center}
.cube-throbber{margin:auto;transform:scale(2);margin-block:48px}
label{display:grid;gap:12px}input{width:240px}
</style>
<span class="cube-throbber" role="img" aria-label="Cubo visto de frente rebotando"><i></i></span>
<label>Velocidad <output id="speed">1.75×</output>
<input aria-label="Velocidad" type="range" min="0.25" max="3" step="0.25" value="1.75" oninput="document.documentElement.style.setProperty('--cube-loading-speed',this.value);document.querySelector('#speed').value=this.value+'×'">
</label>
</html>

:root{color-scheme:light;--bg:#f5f6f2;--paper:#fff;--ink:#26342e;--muted:#7c847d;--muted-2:#8c9785;--line:#e6e9e1;--line-strong:#dde2d7;--green:#315947;--accent-2:#6e8751;--amber-text:#a47b37;--hover:#edf1e7}
:root[data-theme=dark]{color-scheme:dark;--bg:#0c0f0d;--paper:#141816;--ink:#e7ece4;--muted:#97a294;--muted-2:#7d887b;--line:#262d29;--line-strong:#313a35;--green:#a8cf84;--accent-2:#b8d99a;--amber-text:#d9a45e;--hover:#1c2320}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "DM Sans",system-ui,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px)}
header h1{margin:0;font:800 17px/1 Manrope,sans-serif;letter-spacing:-.4px;flex:1}
header button{display:grid;place-items:center;height:36px;padding:0 14px;border:0;border-radius:18px;background:transparent;color:var(--muted);font:600 12px/1 Manrope,sans-serif;cursor:pointer;transition:background .2s,color .2s}
header button:hover,header button[aria-pressed=true]{background:var(--hover);color:var(--ink)}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(620px,1fr));gap:34px 36px;padding:12px 28px 60px}
.pair h2{margin:0 0 10px 4px;font:700 10.5px/1 Manrope,sans-serif;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted)}
.pair div.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){main{grid-template-columns:1fr;padding:8px 14px 40px}.pair div.row{grid-template-columns:1fr}}

/* ═══════════════════ rank card · shared skeleton ═══════════════════ */
.rank-card{--rk-ink:var(--ink);--rk-sub:var(--muted);--rk-acc:var(--green);position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;min-height:146px;padding:18px 20px 15px;border-radius:14px;border:1px solid var(--rk-edge,var(--line));background:var(--rk-bg,var(--paper));color:var(--rk-ink);box-shadow:var(--rk-shadow,none)}
.rank-card>:not(.rk){position:relative;z-index:3}
.rk{position:absolute;pointer-events:none;z-index:1;display:block}
.rank-card .metric-label{display:flex;justify-content:space-between;align-items:center;font:600 11px/1 "DM Sans",sans-serif;color:var(--rk-sub)}
.rank-card .metric-label svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:var(--rk-acc)}
.rank-title{margin-top:9px;font:800 15px/1.1 Manrope,sans-serif;letter-spacing:-.3px;color:var(--rk-acc)}
.rank-card .metric-value{margin-top:8px;font:700 33px/1.1 Manrope,sans-serif;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;color:var(--rk-ink)}
.rank-card .unit{margin-left:5px;font:500 13px "DM Sans",sans-serif;letter-spacing:0;color:var(--rk-sub)}
.rank-card .metric-foot{margin-top:auto;padding-top:9px;font-size:10px;color:var(--rk-sub)}
/* ═══ 1 · Sub 60 · HORIZON: the first sunrise ═══ */

/* ═══ 2 · Sub 45 · BREEZE: wind lines across fresh green ═══ */
.rank-card[data-tier="2"]{--rk-acc:#2c8650;--rk-bg:linear-gradient(135deg,color-mix(in srgb,#8fd3a0 40%,var(--paper)),var(--paper) 72%);--rk-edge:color-mix(in srgb,#5fb07a 50%,var(--line))}
:root[data-theme=dark] .rank-card[data-tier="2"]{--rk-acc:#7fe0a0}
.rank-card[data-tier="2"] .rk.a,.rank-card[data-tier="2"] .rk.b{inset:0;overflow:hidden}
.rank-card[data-tier="2"] .rk.a::before,.rank-card[data-tier="2"] .rk.a::after,.rank-card[data-tier="2"] .rk.b::before{content:"";position:absolute;left:-45%;width:55%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(44,134,80,.9),transparent);animation:wind 4.6s linear infinite}
.rank-card[data-tier="2"] .rk.a::before{top:30%}
.rank-card[data-tier="2"] .rk.a::after{top:55%;width:40%;animation-duration:3.4s;animation-delay:-1.2s}
.rank-card[data-tier="2"] .rk.b::before{top:78%;width:48%;animation-duration:5.6s;animation-delay:-2.6s}
.rank-card[data-tier="2"] .rk.b::after{content:"";position:absolute;right:-26px;bottom:-34px;width:96px;height:96px;border-radius:50%;border:2px solid rgba(44,134,80,.42);border-left-color:transparent;border-bottom-color:transparent;animation:spin 16s linear infinite}
.rank-card[data-tier="2"] .rk.c{right:20px;top:18px;width:6px;height:6px;border-radius:50% 0 50% 0;background:#58b878;animation:float 5s ease-in-out infinite alternate}

/* ═══ 3 · Sub 30 · BRONZE: riveted plate with a slow gleam ═══ */
.rank-card[data-tier="3"]{--rk-ink:#2b1507;--rk-sub:rgba(43,21,7,.72);--rk-acc:#3f1f08;--rk-bg:linear-gradient(135deg,#6b3d19 0,#b9783a 20%,#e4a862 36%,#a2652c 54%,#7b4820 76%,#c98d4c 100%);--rk-edge:#3c2209;--rk-shadow:inset 0 1px 0 rgba(255,236,200,.6),inset 0 -2px 7px rgba(40,18,4,.5),0 8px 22px rgba(90,45,10,.3)}
.rank-card[data-tier="3"] .rank-title,.rank-card[data-tier="3"] .metric-value{text-shadow:0 1px 0 rgba(255,226,180,.55)}

/* ═══ 4 · Sub 25 · STEEL: diamond plate, cold edge, a scanning glint ═══ */
.rank-card[data-tier="4"]{--rk-ink:#eaf3fb;--rk-sub:#9fb3c6;--rk-acc:#8fd0ff;--rk-bg:linear-gradient(160deg,#242c35,#516070 32%,#2b343e 56%,#46535f);--rk-edge:#141a20;--rk-shadow:0 8px 22px rgba(20,40,70,.35)}
.rank-card[data-tier="4"] .metric-value{text-shadow:0 1px 8px rgba(4,8,14,.75),0 0 18px rgba(120,190,255,.25)}
.rank-card[data-tier="4"] .rank-title,.rank-card[data-tier="4"] .metric-label,.rank-card[data-tier="4"] .metric-foot{text-shadow:0 1px 6px rgba(4,8,14,.8)}

/* ═══ 5 · Sub 20 · AURORA: frosted glass over drifting northern light ═══ */
.rank-card[data-tier="5"]{--rk-ink:#e9fff7;--rk-sub:#8fbab3;--rk-acc:#7cf3cf;--rk-bg:linear-gradient(160deg,#06141b,#0b2630 60%,#09192a);--rk-edge:rgba(160,255,230,.28);--rk-shadow:0 10px 30px rgba(20,160,130,.18),inset 0 1px 0 rgba(255,255,255,.14)}
.rank-card[data-tier="5"] .rk.a,.rank-card[data-tier="5"] .rk.b,.rank-card[data-tier="5"] .rk.c{inset:-20%;filter:blur(6px)}
.rank-card[data-tier="5"] .rk.a{background:radial-gradient(ellipse 52% 30% at 30% 42%,rgba(70,255,195,.62),transparent 72%);animation:drift1 9s ease-in-out infinite alternate}
.rank-card[data-tier="5"] .rk.b{background:radial-gradient(ellipse 46% 34% at 72% 48%,rgba(110,140,255,.55),transparent 72%);animation:drift2 12s ease-in-out infinite alternate}
.rank-card[data-tier="5"] .rk.c{background:radial-gradient(ellipse 40% 26% at 50% 72%,rgba(200,100,255,.4),transparent 72%);animation:drift1 15s ease-in-out infinite alternate-reverse}
.rank-card[data-tier="5"]::before{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 38%);pointer-events:none}


/* ═══ 8 · Sub 10 · GOLD: guilloché foil, framed, with a rare flash ═══ */
.rank-card[data-tier="8"]{--rk-ink:#3a2706;--rk-sub:rgba(58,39,6,.74);--rk-acc:#5a3a05;--rk-bg:linear-gradient(135deg,#fbeab0,#e3b65a 24%,#fff0bf 44%,#c7922f 62%,#f1d27b 82%,#b8841f);--rk-edge:#8a5d0e;--rk-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -2px 8px rgba(110,70,10,.35),0 10px 30px rgba(200,150,40,.4)}
.rank-card[data-tier="8"] .rank-title,.rank-card[data-tier="8"] .metric-value{text-shadow:0 1px 0 rgba(255,245,200,.7)}
.rank-card[data-tier="8"] .rk.a{inset:0;background:repeating-radial-gradient(circle at 12% 135%,rgba(110,70,10,.17) 0 1px,transparent 1px 6px),repeating-radial-gradient(circle at 88% -35%,rgba(110,70,10,.13) 0 1px,transparent 1px 7px)}
.rank-card[data-tier="8"] .rk.b{inset:6px;border:1px solid rgba(110,70,10,.55);border-radius:9px}
.rank-card[data-tier="8"] .rk.b::before,.rank-card[data-tier="8"] .rk.b::after{content:"";position:absolute;width:7px;height:7px;background:#7a4f08;transform:rotate(45deg)}
.rank-card[data-tier="8"] .rk.b::before{left:-4px;top:-4px}.rank-card[data-tier="8"] .rk.b::after{right:-4px;bottom:-4px}
.rank-card[data-tier="8"] .rk.c{inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.9) 50%,transparent 60%) 0 0/260% 100%;animation:flash-sweep 5.2s ease-in-out infinite}

/* ═══ 9 · Sub 8 · FORGE: cooling lava cracks and rising embers ═══ */

/* ═══ 9 · Sub 8 · FORGE: a hammered iron plate on the fire, sparks rising off the coals ═══ */

/* ═══ 10 · Sub 7 · CRYSTAL: a cut sapphire that catches the light ═══ */
.rank-card[data-tier="10"]{--rk-ink:#eaf1ff;--rk-sub:#8fa9e0;--rk-acc:#a9c9ff;--rk-bg:linear-gradient(145deg,#081545,#1a3d9e 46%,#0b2268);--rk-edge:rgba(160,200,255,.5);--rk-shadow:0 10px 30px rgba(40,90,255,.35),inset 0 0 0 1px rgba(255,255,255,.12)}
.rank-card[data-tier="10"] .metric-value{text-shadow:0 0 18px rgba(120,170,255,.5)}
.rank-card[data-tier="10"] .rk.a{inset:0;background:var(--facets) 0 0/100% 100% no-repeat;animation:gem 6s ease-in-out infinite alternate;-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,.5),#000 40%);mask-image:linear-gradient(90deg,rgba(0,0,0,.5),#000 40%)}
.rank-card[data-tier="10"] .rk.b,.rank-card[data-tier="10"] .rk.c{width:18px;height:18px;background:linear-gradient(0deg,transparent 45%,#fff 50%,transparent 55%),linear-gradient(90deg,transparent 45%,#fff 50%,transparent 55%),radial-gradient(circle,rgba(255,255,255,.9) 0 2px,transparent 5px);animation:spark 3.2s ease-in-out infinite;opacity:0;z-index:2}
.rank-card[data-tier="10"] .rk.b{left:63%;top:16%}
.rank-card[data-tier="10"] .rk.b::after{content:"";position:absolute;left:92px;top:78px;width:14px;height:14px;background:inherit;animation:inherit;animation-delay:1.1s}
.rank-card[data-tier="10"] .rk.c{left:22%;top:70%;width:14px;height:14px;animation-delay:2.1s}

.rank-card[data-tier="8"].is-rusty{--rk-bg:linear-gradient(135deg,#d3bb74,#ac8a3a 24%,#d9c58a 44%,#9d7628 62%,#c9ab62 82%,#8c681b);--rk-ink:#3a2706;--rk-sub:rgba(58,39,6,.82);--rk-acc:#4d3004;--rk-edge:#5c3b0a;--rk-shadow:inset 0 0 40px rgba(60,30,5,.4),0 8px 22px rgba(120,80,20,.28)}
.rank-card[data-tier="8"].is-rusty .rank-title,.rank-card[data-tier="8"].is-rusty .metric-value,.rank-card[data-tier="8"].is-rusty .metric-label,.rank-card[data-tier="8"].is-rusty .metric-foot{text-shadow:0 0 7px rgba(255,236,176,.85),0 0 2px rgba(255,236,176,.9)}
.rank-card[data-tier="8"].is-rusty .rk.c{animation:ash 7s linear infinite;background:radial-gradient(circle,#f1cf6e 0 1.5px,transparent 2.4px) 0 0/67px 53px,radial-gradient(circle,#d9b04a 0 1.2px,transparent 2px) 21px 19px/89px 71px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 80%);mask-image:linear-gradient(180deg,#000,transparent 80%)}

/* 9 · Forge, rusty: the fire has gone out. Cold iron under ash, two deep embers still breathing */

/* 10 · Crystal: a chipped gem. A corner has broken away, one clean fracture crosses it, the facets have gone milky */

/* 11 · Holographic: signal glitch. The rainbow drains to grey, the title splits into RGB, a scanline tears and pixels are stuck */
.rank-card[data-tier="11"].is-rusty{--rk-bg:linear-gradient(150deg,#15131b,#201c2a 55%,#121018);--rk-ink:#e6e2ee;--rk-sub:#aaa5b8;--rk-edge:rgba(255,255,255,.1);--rk-shadow:0 8px 22px rgba(0,0,0,.4)}

.rank-card[data-tier="11"].is-rusty .rk.ox::before{content:"";position:absolute;inset:0;background:linear-gradient(#ff2d95,#ff2d95) 18% 34%/3px 3px no-repeat,linear-gradient(#3dff7a,#3dff7a) 63% 22%/3px 3px no-repeat,linear-gradient(#fff,#fff) 41% 78%/2px 2px no-repeat,linear-gradient(#2dd8ff,#2dd8ff) 86% 61%/3px 3px no-repeat,linear-gradient(#ff2d95,#ff2d95) 74% 86%/2px 2px no-repeat,linear-gradient(#000,#000) 52% 48%/6px 4px no-repeat}

/* 12 · Supernova, rusty: a burnt-out star. No corona, a cooling ember ring with a dark crust, a few sparks drifting away */
.rank-card[data-tier="12"].is-rusty{--rk-bg:radial-gradient(ellipse 54% 100% at 82% 46%,rgba(120,48,18,.2),transparent 66%),#040303;--rk-edge:rgba(150,80,40,.45);--rk-sub:#a28a66;--rk-acc:#cf9a62;--rk-shadow:0 0 20px rgba(130,56,20,.2)}
.rank-card[data-tier="12"].is-rusty .metric-value{background:linear-gradient(100deg,#b99660,#e2d0ae 45%,#a97d49) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:none;filter:none}
.rank-card[data-tier="12"].is-rusty .rank-title{text-shadow:none}
.rank-card[data-tier="12"].is-rusty::before,.rank-card[data-tier="12"].is-rusty::after,.rank-card[data-tier="12"].is-rusty .rk.b{display:none}
.rank-card[data-tier="12"].is-rusty .rk.a{background:radial-gradient(circle,#8a8078 0 .7px,transparent 1.2px) 0 0/43px 39px;opacity:.35;animation:none}
.rank-card[data-tier="12"].is-rusty .rk.a::after{background:radial-gradient(circle,#ff9a4a 0 1.3px,transparent 2.1px) 0 0/97px 83px,radial-gradient(circle,#c9561c 0 1.1px,transparent 1.9px) 31px 41px/71px 79px;animation-duration:6s}
.rank-card[data-tier="12"].is-rusty .rk.c{background:radial-gradient(circle,rgba(150,52,16,.42) 0,rgba(120,40,12,.2) 18%,transparent 52%);animation:ember-pulse 4s ease-in-out infinite}
.rank-card[data-tier="12"].is-rusty .rk.c::after{box-shadow:0 0 0 1px #2b140c,0 0 20px 4px rgba(120,40,12,.35)}
.rank-card[data-tier="12"].is-rusty .rk.c::before{inset:0;width:auto;height:auto;margin:0;left:50%;top:50%;width:92px;height:92px;margin:-46px 0 0 -46px;background:conic-gradient(from 20deg,#ff7a2a 0 36deg,#7a2a10 62deg 128deg,#24100a 150deg 250deg,#bb4813 280deg 326deg,#ff7a2a 360deg);-webkit-mask-image:radial-gradient(circle,transparent 36px,#000 37px 44px,transparent 45px);mask-image:radial-gradient(circle,transparent 36px,#000 37px 44px,transparent 45px);animation:spin 70s linear infinite,ember-pulse 5s ease-in-out infinite}
.rank-card[data-tier="12"].is-rusty .rk.ox{background:var(--t-soot);background-size:100% 100%;-webkit-mask-image:linear-gradient(0deg,#000,transparent 70%);mask-image:linear-gradient(0deg,#000,transparent 70%);opacity:.8}

/* ═══════════ pass 3 · fixed proportions, live fire, obsidian, lit corrosion ═══════════ */
@keyframes shimmer{from{transform:translateX(-4px) scaleX(.97);opacity:.62}to{transform:translateX(4px) scaleX(1.03);opacity:1}}
@keyframes ripple{0%{transform:scale(.15);opacity:0}16%{opacity:.85}100%{transform:scale(1.7);opacity:0}}

/* ═══ 1 · Sub 60 · HORIZON: first light over a calm sea ═══ */
.rank-card[data-tier="1"]{--hz:73%;--sunx:80%;--s1:#9fcbea;--s2:#ffe3c2;--s3:#ffb184;--w1:#8db9d2;--w2:#5f93b4;--rk-acc:#b4552a;--rk-sub:#46535b;--rk-bg:linear-gradient(180deg,var(--s1) 0,var(--s2) calc(var(--hz) - 12%),var(--s3) var(--hz),var(--w1) var(--hz),var(--w2) 100%);--rk-edge:color-mix(in srgb,#e89a72 45%,var(--line))}
:root[data-theme=dark] .rank-card[data-tier="1"]{--s1:#0a1230;--s2:#3a2a58;--s3:#d9703f;--w1:#17233f;--w2:#0a1222;--rk-acc:#ffa77a;--rk-sub:#b4bdd0}
.rank-card[data-tier="1"]:not(.is-rusty) .rk.a{left:0;right:0;top:var(--hz);bottom:0;border-top:1px solid rgba(255,218,176,.85);background:repeating-linear-gradient(180deg,rgba(255,226,190,.8) 0 1px,transparent 1px 6px);-webkit-mask-image:radial-gradient(ellipse 46px 100% at var(--sunx) 0,#000,transparent 100%);mask-image:radial-gradient(ellipse 46px 100% at var(--sunx) 0,#000,transparent 100%);animation:shimmer 2.6s ease-in-out infinite alternate}
.rank-card[data-tier="1"]:not(.is-rusty) .rk.b{left:calc(var(--sunx) - 28px);top:calc(var(--hz) - 28px);width:56px;height:28px;overflow:hidden}

.rank-card[data-tier="1"]:not(.is-rusty) .rk.c{inset:0;background:radial-gradient(ellipse 150px 92px at var(--sunx) var(--hz),rgba(255,176,118,.66),rgba(255,150,100,.2) 46%,transparent 100%);-webkit-mask-image:linear-gradient(180deg,#000 var(--hz),rgba(0,0,0,.3) calc(var(--hz) + 1%),transparent 100%);mask-image:linear-gradient(180deg,#000 var(--hz),rgba(0,0,0,.3) calc(var(--hz) + 1%),transparent 100%);animation:breathe 7s ease-in-out infinite alternate}
.rank-card[data-tier="1"]:not(.is-rusty)::after{content:"";position:absolute;left:-12%;width:124%;top:0;height:var(--hz);z-index:1;pointer-events:none;background:radial-gradient(ellipse 54px 9px at 24% 30%,rgba(255,255,255,.6),transparent 72%),radial-gradient(ellipse 84px 11px at 62% 20%,rgba(255,255,255,.45),transparent 72%),radial-gradient(ellipse 46px 7px at 84% 48%,rgba(255,238,226,.55),transparent 72%);animation:cloud 16s ease-in-out infinite alternate}
:root[data-theme=dark] .rank-card[data-tier="1"]:not(.is-rusty)::after{opacity:.3}
.rank-card[data-tier="1"]:not(.is-rusty)::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(var(--hz) - 12%);z-index:1;pointer-events:none;background:radial-gradient(circle,#fff 0 .8px,transparent 1.3px) 0 0/37px 29px,radial-gradient(circle,#cfe0ff 0 .6px,transparent 1.1px) 14px 11px/53px 41px;-webkit-mask-image:linear-gradient(180deg,#000,transparent);mask-image:linear-gradient(180deg,#000,transparent);animation:twinkle 3.4s ease-in-out infinite alternate}
:root:not([data-theme=dark]) .rank-card[data-tier="1"]:not(.is-rusty)::before{display:none}

/* 1 · rusty: a storm rolls in, the sun is a smudge, rain pocks the sea, lightning now and then */
.rank-card[data-tier="1"].is-rusty{--s1:#4c555f;--s2:#707982;--s3:#8d8f8e;--w1:#4a5a68;--w2:#2e3a46;--rk-ink:#f5f1e8;--rk-sub:rgba(245,241,232,.74);--rk-acc:#ffe0b8;--rk-edge:rgba(200,210,220,.3);--rk-shadow:none}
:root[data-theme=dark] .rank-card[data-tier="1"].is-rusty{--s1:#20262d;--s2:#363e47;--s3:#585c60;--w1:#1e2a35;--w2:#0f1820;--rk-acc:#ffe0b8}

.rank-card[data-tier="1"].is-rusty .rk.a::after{left:84%;top:calc(var(--hz) + 15%);animation-delay:-1.1s;animation-duration:3.9s}
.rank-card[data-tier="1"].is-rusty .rk.b::after{left:94%;top:calc(var(--hz) + 4%);animation-delay:-2.3s}
.rank-card[data-tier="1"].is-rusty .rk.b{inset:0;width:auto;height:auto;overflow:visible}
.rank-card[data-tier="1"].is-rusty .rk.b::before{content:"";position:absolute;left:calc(var(--sunx) - 17px);top:calc(var(--hz) - 40px);width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#efe2c0,#b9a98a);opacity:.38;filter:blur(1.5px);animation:breathe 6s ease-in-out infinite alternate}
.rank-card[data-tier="1"].is-rusty .rk.c{left:-12%;right:auto;top:0;width:124%;height:var(--hz);background:radial-gradient(ellipse 100px 18px at 30% 40%,rgba(170,176,184,.38),transparent 72%),radial-gradient(ellipse 90px 16px at 74% 28%,rgba(150,156,164,.42),transparent 72%);animation:cloud 17s ease-in-out -6s infinite alternate-reverse}
.rank-card[data-tier="1"].is-rusty::after{content:"";position:absolute;left:-12%;width:124%;top:0;height:calc(var(--hz) + 4%);z-index:1;pointer-events:none;background:radial-gradient(ellipse 110px 28px at 18% 24%,rgba(24,29,36,.92),transparent 74%),radial-gradient(ellipse 140px 32px at 58% 12%,rgba(20,24,31,.95),transparent 72%),radial-gradient(ellipse 80px 20px at 90% 36%,rgba(34,40,48,.7),transparent 72%),radial-gradient(ellipse 140px 30px at 40% 46%,rgba(60,66,74,.5),transparent 72%);animation:cloud 11s ease-in-out infinite alternate}
.rank-card[data-tier="1"].is-rusty::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse 60% 70% at 72% 0,rgba(235,242,255,.9),rgba(200,215,240,.25) 45%,transparent 75%);opacity:0;animation:lightning 8s linear infinite}



/* ═══ 7 · Sub 12 · OBSIDIAN: struck volcanic glass. Broad conchoidal scars, hackle lines, and light that only catches the facets ═══ */
.rank-card[data-tier="7"]{--rk-ink:#f3f5fa;--rk-sub:#aab2c1;--rk-acc:#cbd5e8;--rk-bg:linear-gradient(160deg,#0a0c11,#0e1117 55%,#07080c);--rk-edge:rgba(170,185,215,.24);--rk-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(0,0,0,.6),inset 0 0 36px rgba(0,0,0,.55)}
.rank-card[data-tier="7"] .rank-title,.rank-card[data-tier="7"] .metric-value,.rank-card[data-tier="7"] .metric-label,.rank-card[data-tier="7"] .metric-foot{text-shadow:0 1px 10px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.6)}
.rk.pbr{inset:0;width:100%;height:100%;z-index:0}
.rank-card:is([data-tier="3"],[data-tier="4"],[data-tier="7"]) .rk:not(.pbr):not(.b){display:none}
.rank-card:is([data-tier="3"],[data-tier="4"]) .rk.b{inset:0}
.rank-card[data-tier="4"] .rk.b{background:linear-gradient(90deg,rgba(8,12,18,.5),rgba(8,12,18,.14) 62%,transparent)}
.rank-card[data-tier="7"] .rk.b{inset:0;background:radial-gradient(ellipse 62% 95% at 24% 0,rgba(160,175,205,.2),transparent 72%),linear-gradient(90deg,rgba(4,5,8,.6),rgba(4,5,8,.1) 58%,rgba(4,5,8,.24))}

/* 7 · rusty: weathered obsidian. The gloss is gone, the scars are dull, dust sits in them and the edge has chipped */
.rank-card[data-tier="7"].is-rusty{--rk-ink:#e8e9ee;--rk-sub:#9b9ea8;--rk-acc:#aeb2bf;--rk-bg:linear-gradient(160deg,#14151a,#191a20 50%,#101116);--rk-edge:#2c2d35;--rk-shadow:inset 0 0 30px rgba(0,0,0,.4)}
.rank-card[data-tier="7"].is-rusty .rk.b{background:linear-gradient(90deg,rgba(12,12,16,.55),rgba(12,12,16,.15) 60%,rgba(12,12,16,.3))}

/* ═══ 9 · Sub 8 · FORGE: hammered iron over a living fire (canvas) ═══ */
.rank-card[data-tier="9"]{--rk-ink:#ffeedb;--rk-sub:#e8cdb0;--rk-acc:#ffb05a;--rk-bg:var(--hammer) 0 0/100% 100% no-repeat,linear-gradient(180deg,#2b2523,#191514 58%,#100c0b);--rk-edge:#050303;--rk-shadow:0 10px 30px rgba(255,100,20,.3),inset 0 0 0 2px #0b0807,inset 0 0 0 3px rgba(255,255,255,.07),inset 0 4px 10px -2px rgba(255,255,255,.1)}
.rank-card[data-tier="9"] .rank-title,.rank-card[data-tier="9"] .metric-foot,.rank-card[data-tier="9"] .metric-label{text-shadow:0 1px 8px #000,0 0 3px #000}
.rank-card[data-tier="9"] .metric-value{background:linear-gradient(180deg,#fff9e8 8%,#ffdfa6 52%,#ffb25a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(255,110,30,.55)) drop-shadow(0 2px 6px #000)}
.rank-card[data-tier="9"] .rk.fire{inset:0;width:100%;height:100%}
.rank-card[data-tier="9"].is-rusty .rk.fire{z-index:2}
.rank-card[data-tier="9"] .rk.a{left:0;right:0;bottom:0;height:56%;background:linear-gradient(0deg,rgba(255,150,50,.5) 0,rgba(255,84,20,.2) 38%,rgba(255,60,10,.06) 72%,transparent);mix-blend-mode:screen;animation:breathe 2.6s ease-in-out infinite alternate}
.rank-card[data-tier="9"] .rk.b,.rank-card[data-tier="9"] .rk.c{display:none}
.rank-card[data-tier="9"]::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;z-index:2;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,206,140,.95),transparent) -60% 0/40% 100% no-repeat;animation:topglint 4.4s linear infinite}

/* 9 · rusty: the fire has been put out. Smoke curls off two dying coals, soot and cold iron */
.rank-card[data-tier="9"].is-rusty{--rk-bg:var(--hammer) 0 0/100% 100% no-repeat,linear-gradient(180deg,#26231f,#171513 58%,#0f0d0c);--rk-edge:#0a0807;--rk-ink:#e9ddd0;--rk-sub:#a79b8d;--rk-acc:#c98b58;--rk-shadow:inset 0 0 0 2px #0b0807,inset 0 0 0 3px rgba(255,255,255,.05)}
.rank-card[data-tier="9"].is-rusty .metric-value{background:none;color:var(--rk-ink);filter:none;text-shadow:0 1px 8px #000}
.rank-card[data-tier="9"].is-rusty::before{display:none}
.rank-card[data-tier="9"].is-rusty .rk.a{display:none}
.rank-card[data-tier="9"].is-rusty .rk.ox{background:var(--t-soot) 0 0/100% 100% no-repeat;-webkit-mask-image:linear-gradient(0deg,#000,transparent 70%);mask-image:linear-gradient(0deg,#000,transparent 70%);opacity:.8}


.rank-card[data-tier="4"].is-rusty .metric-value{text-shadow:0 1px 10px rgba(0,0,0,.6)}

/* ═══ 8 · Gold, rusty: old gilding. A web of craquelure with dirt in every crack, flakes lost, the corners gone dull ═══ */
.rank-card[data-tier="8"].is-rusty .rk.ox{background:var(--crackle) 0 0/100% 100% no-repeat;filter:none;opacity:1}
.rank-card[data-tier="8"].is-rusty .rk.b{border-color:rgba(70,40,5,.55)}
.rank-card[data-tier="8"].is-rusty::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 80% 90% at 50% 50%,transparent 45%,rgba(70,38,8,.4) 100%),radial-gradient(circle at 0 100%,rgba(96,78,24,.5),transparent 42%),radial-gradient(circle at 100% 0,rgba(96,78,24,.35),transparent 36%)}

/* ═══ 10 · Crystal, rusty: a gem nobody has dusted in years. Cobweb in the corner, a fingerprint on the glass, a film of dust ═══ */
.rank-card[data-tier="10"].is-rusty{--rk-bg:linear-gradient(145deg,#12182e,#2a3764 46%,#161d3a);--rk-ink:#e5ebf8;--rk-sub:#9aa7c6;--rk-acc:#bdcaee;--rk-edge:rgba(190,205,240,.38);--rk-shadow:none}
.rank-card[data-tier="10"].is-rusty .metric-value{text-shadow:0 1px 10px rgba(0,0,20,.5)}

.rank-card[data-tier="10"].is-rusty .rk.c{left:0;top:0;right:0;bottom:0;width:auto;height:auto;background:var(--t-dust) 0 0/100% 100% no-repeat;animation:none;opacity:.22}
.rank-card[data-tier="10"].is-rusty .rk.ox{background:none}
.rank-card[data-tier="10"].is-rusty .rk.ox::after{content:"";position:absolute;left:46%;top:14%;width:72px;height:88px;background:var(--fp) center/contain no-repeat;opacity:.15;transform:rotate(-24deg);filter:blur(.7px)}

/* polish: an unranked-style safety net for the proportion, and the gallery */
.rank-card{aspect-ratio:2.3/1}

/* polish: legibility over decay + trophy contrast on busy tiers */
.is-rusty .rank-title,.is-rusty .metric-value,.is-rusty .metric-label,.is-rusty .metric-foot,.is-rusty .metric-sub{text-shadow:0 1px 10px rgba(0,0,0,.5)}

<header><h1>Rank cards</h1><button id="motion" aria-pressed="true">Motion on</button><button id="theme">Light / dark</button></header>
<main id="grid"></main>
<script>
"use strict";
const root = document.documentElement, $ = s => document.querySelector(s);
const uri = svg => `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
/* organic decay textures: fractal noise thresholded into soft blotches, tinted per material */
const tex = (rgb, freq, k, c, seed, oct = 4, srgb = false) => uri(`<svg xmlns="http://www.w3.org/2000/svg" width="360" height="190"><filter id="f" x="0" y="0" width="100%" height="100%"${srgb ? ' color-interpolation-filters="sRGB"' : ""}><feTurbulence type="fractalNoise" baseFrequency="${freq}" numOctaves="${oct}" seed="${seed}"/><feColorMatrix values="0 0 0 0 ${rgb[0]} 0 0 0 0 ${rgb[1]} 0 0 0 0 ${rgb[2]} ${k} 0 0 0 ${c}"/></filter><rect width="360" height="190" filter="url(#f)"/></svg>`);

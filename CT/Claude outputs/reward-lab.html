:root{
  color-scheme:light;
  --bg:#f5f6f2; --paper:#ffffff; --ink:#26342e; --muted:#7c847d; --line:#e6e9e1; --hover:#edf1e7;
  --green:#315947; --accent2:#6e8751; --lime:#a9be7c; --gold:#bf9142; --rust:#a57250; --warn:#c38b4a; --danger:#ad674c;
  --shade:rgb(245 246 242 / .62);
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#0c0f0d; --paper:#141816; --ink:#e7ece4; --muted:#97a294; --line:#262d29; --hover:#1c2320;
  --green:#a8cf84; --accent2:#b8d99a; --lime:#cbe6a1; --gold:#f0c56a; --rust:#c98a5c; --warn:#d9a45e; --danger:#e3906c;
  --shade:rgb(0 0 0 / .5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;grid-template-columns:272px 1fr;background:var(--bg);color:var(--ink);font:15px/1.4 "DM Sans",system-ui,sans-serif;overflow:hidden}

/* ───────── effect list ───────── */
nav{overflow-y:auto;padding:26px 14px 30px;border-right:1px solid var(--line);scrollbar-width:thin}
nav h1{margin:0 12px 22px;font:800 17px/1 Manrope,sans-serif;letter-spacing:-.4px}
nav h2{margin:22px 12px 6px;font:700 10.5px/1 Manrope,sans-serif;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted)}
.item{display:flex;flex-direction:column;gap:1px;width:100%;padding:8px 12px;border:0;border-radius:10px;background:none;color:var(--muted);text-align:left;font:inherit;cursor:pointer;transition:background .2s,color .2s}
.item small{font-size:12px;opacity:.7}
.item:hover{background:var(--hover);color:var(--ink)}
.item[aria-current=true]{background:var(--hover);color:var(--ink)}
.item[aria-current=true] span{font-weight:700}
.item[aria-current=true] small{color:var(--green);opacity:1}

/* ───────── stage ───────── */
main{position:relative;overflow:hidden;isolation:isolate}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.shade{position:absolute;inset:0;z-index:2;background:var(--shade);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .4s}
.shade.on{opacity:1;pointer-events:auto}
.flash{position:absolute;inset:0;z-index:7;opacity:0;pointer-events:none}
.core{position:absolute;left:50%;top:39%;transform:translate(-50%,-50%);z-index:4;text-align:center}
.scramble{margin:0 0 6px;font:500 13px/1.4 Consolas,monospace;color:var(--muted);letter-spacing:.5px;white-space:nowrap}
.wrap{position:relative;display:inline-block}
#digits,.shard,.crackfx,.gleam{display:block;font:800 clamp(78px,16.5vw,196px)/1 Manrope,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.045em;color:var(--ink);text-align:center;will-change:transform,filter;transition:color .5s,text-shadow .5s}
.shard,.crackfx,.gleam{position:absolute;inset:0;color:var(--ink);will-change:transform,opacity}
.cracked,.crackfx,.gleam{color:transparent!important;-webkit-background-clip:text;background-clip:text;background-repeat:no-repeat}
.crackfx{-webkit-mask-image:radial-gradient(circle at var(--px) var(--py),#000 var(--r),transparent calc(var(--r) + 26px));mask-image:radial-gradient(circle at var(--px) var(--py),#000 var(--r),transparent calc(var(--r) + 26px))}
.gleam{background-image:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%);background-size:250% 100%;background-position:130% 0;transition:none}
.hint{position:absolute;left:0;right:0;bottom:18px;z-index:1;text-align:center;font-size:12px;color:var(--muted)}
.tools{position:absolute;top:16px;right:16px;z-index:8;display:flex;gap:6px}
.tools button{display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.tools button:hover{background:var(--hover);color:var(--ink)}
.tools svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}


.bar{position:absolute;left:0;right:0;height:9vh;background:#000;z-index:5;pointer-events:none;transition:transform .8s cubic-bezier(.7,0,.2,1)}
.bar.t{top:0;transform:translateY(-100%)}
.bar.b{bottom:0;transform:translateY(100%)}
main.cine .bar{transform:none}
main.cine .shade{background:rgb(0 0 0 / .35)}
main.cine #digits,main.cine .scramble,main.cine .note{color:#f2f5ee}
#digits.gold{color:var(--gold)!important;text-shadow:0 0 50px color-mix(in srgb,var(--gold) 55%,transparent)}
.note{margin:14px 0 0;min-height:1.4em;font-size:13px;color:var(--muted);opacity:0}

/* ───────── reward card ───────── */
.card{--rc:var(--green);position:absolute;left:50%;top:75%;z-index:6;display:flex;flex-direction:column;align-items:center;gap:7px;width:min(540px,calc(100% - 32px));padding:22px 28px 24px;border:1.5px solid color-mix(in srgb,var(--rc) 50%,var(--line));border-radius:18px;background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--rc) 13%,transparent),transparent 75%),var(--paper);text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,-46%) scale(.9);transition:opacity .3s,transform .75s cubic-bezier(.16,1.25,.3,1)}
.card.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.card small{font:700 10.5px/1 Manrope,sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--rc)}
.card strong{font:700 18px/1.25 Manrope,sans-serif;letter-spacing:-.3px}
.card span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;animation:fade-up .6s both;animation-delay:calc(.35s + var(--i)*.14s)}
.hero{display:block;margin:2px 0;font:800 clamp(34px,6vw,62px)/1.05 Manrope,sans-serif;letter-spacing:-.04em;color:var(--rc);font-variant-numeric:tabular-nums;white-space:nowrap}
.hero i{display:inline-block;font-style:normal;animation:letter-in .8s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i)*55ms)}
.card[data-big=true]{width:min(640px,calc(100% - 32px))}
.card[data-big=true] .hero{font-size:clamp(52px,10vw,112px);letter-spacing:-.05em}
@keyframes letter-in{from{opacity:0;transform:translateY(.55em) scale(.8);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes fade-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card[data-skin=gold]{--rc:var(--gold);border-width:2px;background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--gold) 22%,transparent),transparent 78%),var(--paper);box-shadow:0 0 70px color-mix(in srgb,var(--gold) 26%,transparent),inset 0 0 0 4px var(--paper),inset 0 0 0 5px color-mix(in srgb,var(--gold) 45%,transparent)}
.card[data-skin=muted]{--rc:var(--muted);background:var(--paper)}
.card[data-skin=amber]{--rc:var(--warn)}
.card[data-skin=rust]{--rc:var(--rust);border-width:2px;background:radial-gradient(ellipse at 15% 20%,#a5725030 0 1px,transparent 2px) 0 0/31px 47px,radial-gradient(circle at 72% 82%,#a5725040 0 1px,transparent 3px) 7px 13px/53px 29px,radial-gradient(ellipse at bottom right,#99582d45,transparent 65%),var(--paper)}
.card[data-skin=chrono]{--rc:var(--gold);border:2px solid transparent;background:linear-gradient(var(--paper),var(--paper)) padding-box,conic-gradient(from 20deg,#f7f1dc,#c9a24a,#6b7480,#e9edf1,#c9a24a,#f7f1dc) border-box;box-shadow:0 0 60px color-mix(in srgb,var(--gold) 22%,transparent)}
.card[data-skin=nova]{--rc:var(--gold);border:0;background:none;box-shadow:none}
.card[data-skin=nova] .hero{background:linear-gradient(100deg,var(--gold) 20%,#fff 45%,var(--gold) 70%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 3s linear infinite}
.card[data-skin=nova] .hero i{animation-name:letter-in;background:inherit;-webkit-background-clip:text;background-clip:text}
.card[data-skin=nova] strong{font-size:22px}
@keyframes shimmer{to{background-position:-250% 0}}
.card[data-skin=forge] .hero i{animation:forge-in 1.4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
@keyframes forge-in{0%{opacity:0;transform:scale(1.6);filter:brightness(4) blur(8px);color:#fff}35%{opacity:1;transform:scale(.96);filter:brightness(2.4) drop-shadow(0 0 18px #ff8a3c)}100%{opacity:1;transform:none;filter:none}}
.card[data-skin=forge]{--rc:var(--gold);border-width:2px;background:radial-gradient(ellipse at 50% 100%,#ff7a2e30,transparent 70%),var(--paper);box-shadow:0 0 80px #ff8a3c33,inset 0 0 0 4px var(--paper),inset 0 0 0 5px color-mix(in srgb,var(--gold) 45%,transparent)}

@media (max-width:760px){
  body{grid-template-columns:1fr;grid-template-rows:1fr auto}
  nav{order:2;display:flex;gap:4px;overflow:auto hidden;padding:8px 10px;border-right:0;border-top:1px solid var(--line)}
  nav h1,nav h2{display:none}
  .item{width:auto;flex:none;white-space:nowrap}
  .hint{display:none}
  .core{top:34%}
  .card{top:72%;padding:18px 18px 20px}
}
@media (prefers-reduced-motion:reduce){.card,.hero i,.card span{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<nav id="nav" aria-label="Effects"></nav>
<main id="stage">
  <div class="shade" id="shade"></div>
  <canvas id="fx"></canvas>
  <div class="core" id="core">
    <p class="scramble" id="scramble">R2 U' F D2 L B' U2 R' F2 D L2 U B R' D2 F' U2 L</p>
    <div class="wrap" id="wrap"><b id="digits">0.00</b></div>
    <p class="note" id="note"></p>
  </div>
  <div class="card" id="card" role="status"></div>
  <div class="bar t"></div><div class="bar b"></div>
  <div class="flash" id="flash"></div>
  <p class="hint">Space replays · ↑ ↓ switches · click a reward to dismiss</p>
  <div class="tools">
    <button id="replay" title="Replay" aria-label="Replay"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg></button>
    <button id="theme" title="Light / dark" aria-label="Toggle theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg></button>
  </div>
</main>

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════
   Reward Lab · every achievement gets its own motion language.
   Layers:  toolkit (maths, particles) → stage (DOM + canvas) → effects
   ════════════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const clamp01 = t => Math.min(1, Math.max(0, t));

  current = i; nav.querySelectorAll(".item").forEach(b => b.setAttribute("aria-current", Number(b.dataset.i) === i)); nav.querySelector(`[data-i="${i}"]`)?.scrollIntoView({ block: "nearest" });
  S.reset(); resize(); S.g = geometry(); S.col = palette();
  if (FX[i].solve < MIN_REWARD_SOLVE) { S.set(FX[i].solve.toFixed(2)); S.pulse(); S.later(() => S.card({ skin: "muted", eyebrow: `Under ${MIN_REWARD_SOLVE} s · no reward`, title: pick(COPY.accident), lines: ["Probably an accidental press."], modal: false, auto: 3200 }), .35); return; }
  FX[i].run();
}
nav.addEventListener("click", e => { const b = e.target.closest(".item"); if (b) play(Number(b.dataset.i)); });
$("#replay").onclick = () => play();
$("#theme").onclick = () => { document.documentElement.dataset.theme = isDark() ? "light" : "dark"; play(); };
shade.onclick = card.onclick = () => S.hideCard();
addEventListener("keydown", e => {
  if (e.code === "Space" || e.key === "Enter") { e.preventDefault(); play(); }
  else if (e.key === "ArrowDown") { e.preventDefault(); play((current + 1) % FX.length); }
  else if (e.key === "ArrowUp") { e.preventDefault(); play((current - 1 + FX.length) % FX.length); }
});
document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
document.fonts.ready.then(() => { resize(); window.__ready = true; play(FX.findIndex(f => f.id === "pb-single")); });
</script>
</body>

:root{
  color-scheme:light;
  --bg:#f5f6f2;--paper:#ffffff;--surface-2:#fafbf8;--hover:#f1f4ea;--line:#e6e9e1;--line-strong:#d6dccf;
  --ink:#26342e;--muted:#6f786f;--muted-2:#8c9785;--green:#315947;--solid:#315947;--solid-fg:#fff;--solid-hover:#244533;
  --lime:#dcedab;--accent-soft:#e9efdf;--ok:#84a56e;--warn:#b27a35;--danger:#ad674c;--mark:#f3e3a3;--mark-ink:#2a2208;--shadow:0 12px 40px #243e2b26;
  --font-ui:"DM Sans",Arial,sans-serif;--font-head:"Manrope","DM Sans",sans-serif;--font-mono:Consolas,"SFMono-Regular",monospace;
  /* type scale: the "tiny" set is today's app, the "easy" set is the proposal */
  --fs-micro:9px;--fs-small:11px;--fs-body:12px;--fs-lead:15px;--fs-num:15px;--fs-stat:22px;--row-h:49px;--tool-h:36px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c0f0d;--paper:#141816;--surface-2:#191e1b;--hover:#1c2320;--line:#262d29;--line-strong:#2f3833;
  --ink:#e7ece4;--muted:#97a294;--muted-2:#869180;--green:#a8cf84;--solid:#cbe6a1;--solid-fg:#14201a;--solid-hover:#dcedab;
  --lime:#cbe6a1;--accent-soft:#1e2a1e;--ok:#8dc169;--warn:#d9a45e;--danger:#e3906c;--mark:#5a4d17;--mark-ink:#fff4c4;--shadow:0 14px 44px #0000008c;
}
:root[data-size="easy"]{--fs-micro:12px;--fs-small:13px;--fs-body:14.5px;--fs-lead:16px;--fs-num:19px;--fs-stat:30px;--row-h:60px;--tool-h:44px}
:root[data-font="inter"]{--font-ui:"Inter",Arial,sans-serif;--font-head:"Inter",sans-serif;--font-mono:"JetBrains Mono",Consolas,monospace}
:root[data-font="geist"]{--font-ui:"Geist",Arial,sans-serif;--font-head:"Geist",sans-serif;--font-mono:"Geist Mono",Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 var(--fs-body)/1.45 var(--font-ui);-webkit-font-smoothing:antialiased;min-height:100vh;transition:background .25s,color .25s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus,input:focus,select:focus{outline:none}
svg{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.page{padding:36px clamp(20px,3.2vw,56px) 120px;max-width:1700px;margin:0 auto}
/* ───── header ───── */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
h1{margin:0;font:500 clamp(34px,3vw,46px)/1.05 var(--font-head);letter-spacing:-.03em}
.actions{display:flex;gap:10px;align-items:center;position:relative}
.btn{display:inline-flex;align-items:center;gap:8px;height:var(--tool-h);padding:0 16px;border-radius:12px;font-weight:600;font-size:var(--fs-body);transition:background .15s,transform .15s}
.btn.primary{background:var(--solid);color:var(--solid-fg)}
.btn.primary:hover{background:var(--solid-hover)}
.btn.ghost{border:1px solid var(--line-strong)}
.btn.ghost:hover{background:var(--hover)}
.btn:active{transform:scale(.97)}
.icon-btn{display:grid;place-items:center;width:var(--tool-h);height:var(--tool-h);border-radius:12px;border:1px solid var(--line-strong)}
.icon-btn:hover{background:var(--hover)}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:210px;padding:6px;border-radius:14px;background:var(--paper);border:1px solid var(--line-strong);box-shadow:var(--shadow);z-index:30;opacity:0;transform:translateY(-4px) scale(.98);pointer-events:none;transition:.15s;transform-origin:top right}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:9px;text-align:left;font-size:var(--fs-body)}
.menu button:hover,.menu button.on{background:var(--hover)}
.menu button.on{color:var(--green);font-weight:600}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
/* ───── summary ───── */
.summary{display:flex;gap:clamp(24px,4vw,64px);flex-wrap:wrap;margin:26px 0 22px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:500 var(--fs-stat)/1.1 var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:var(--fs-small)}
.stat.best b{color:var(--green)}
/* ───── toolbar ───── */
.sticky{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 82%,transparent);padding:8px 0 0;margin:0 calc(clamp(20px,3.2vw,56px)*-1);padding-inline:clamp(20px,3.2vw,56px)}
.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px}
.search{position:relative;flex:1 1 320px;max-width:520px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:var(--tool-h);padding:0 74px 0 42px;border-radius:12px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);font:400 var(--fs-lead) var(--font-ui);transition:border-color .15s,box-shadow .15s}
.search input::placeholder{color:var(--muted-2)}
.search input:focus{border-color:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 14%,transparent)}
.search .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:8px;display:none;place-items:center;color:var(--muted)}
.search .clear:hover{background:var(--hover);color:var(--ink)}
.search.has .clear{display:grid}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:500 var(--fs-micro) var(--font-mono);color:var(--muted-2);border:1px solid var(--line-strong);border-radius:6px;padding:2px 7px}
.search.has kbd,.search.focus kbd{display:none}
.seg{display:inline-flex;height:var(--tool-h);padding:3px;border-radius:12px;border:1px solid var(--line-strong);background:var(--paper);gap:2px}
.seg button{padding:0 14px;border-radius:9px;font-size:var(--fs-body);font-weight:500;color:var(--muted);transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--solid);color:var(--solid-fg);font-weight:600}
.datebtn{display:inline-flex;align-items:center;gap:8px;height:var(--tool-h);padding:0 14px;border-radius:12px;border:1px solid var(--line-strong);background:var(--paper);font-size:var(--fs-body);font-weight:500}
.datebtn:hover{background:var(--hover)}
.datebtn.on{border-color:var(--green);color:var(--green)}
.datewrap{position:relative}
.datepop{position:absolute;left:0;top:calc(100% + 8px);width:300px}
.range{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 6px 8px}
.range label{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-small);color:var(--muted)}
.range input{min-width:0;width:100%;height:36px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);padding:0 8px;font:inherit;font-size:var(--fs-body);color-scheme:inherit}
.grow{flex:1}
.count{color:var(--muted);font-size:var(--fs-body);font-variant-numeric:tabular-nums;white-space:nowrap}
.count b{color:var(--ink);font-weight:600}
.linkbtn{color:var(--green);font-weight:600;font-size:var(--fs-body);padding:6px 4px;border-radius:6px}
.linkbtn:hover{text-decoration:underline}
.linkbtn[hidden]{display:none}
/* ───── table ───── */
.cols,.row{display:grid;grid-template-columns:76px minmax(120px,170px) minmax(90px,130px) minmax(160px,1fr) 190px 176px;align-items:center;column-gap:18px;padding:0 14px}
.cols{height:36px;border-bottom:1px solid var(--line-strong);color:var(--muted);font-size:var(--fs-micro);font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.cols button{display:inline-flex;align-items:center;gap:6px;text-transform:inherit;letter-spacing:inherit;font-weight:inherit;font-size:inherit;color:inherit;height:100%;border-radius:6px}
.cols button.sortable:hover{color:var(--ink)}
.cols button.on{color:var(--ink)}
.cols button .arr{opacity:0;transition:opacity .15s,transform .2s}
.cols button.on .arr{opacity:1}
.cols button.asc .arr{transform:rotate(180deg)}
.day{display:flex;align-items:baseline;gap:14px;padding:26px 14px 8px;font-size:var(--fs-small);color:var(--muted)}
.day b{font:600 var(--fs-lead) var(--font-head);color:var(--ink);letter-spacing:-.01em}
.day span{font-variant-numeric:tabular-nums}
.row{position:relative;height:var(--row-h);border-bottom:1px solid var(--line);border-radius:0;cursor:pointer;transition:background .12s;content-visibility:auto;contain-intrinsic-size:auto var(--row-h)}
.row:hover,.row.sel{background:var(--hover)}
.row.sel::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--green)}
.row .no{color:var(--muted);font:400 var(--fs-body) var(--font-mono);font-variant-numeric:tabular-nums}
.row .time{font:500 var(--fs-num) var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em;display:flex;align-items:baseline;gap:6px}
.row .time small{font-size:var(--fs-small);color:var(--warn);font-weight:600}
.row.dnf .time{color:var(--danger);text-decoration:line-through;text-decoration-thickness:1.5px}
.row.best .time{color:var(--green)}
.row.best .time::after{content:"PB";font:700 var(--fs-micro) var(--font-ui);letter-spacing:.08em;color:var(--green);border:1px solid color-mix(in srgb,var(--green) 55%,transparent);border-radius:5px;padding:1px 5px;align-self:center}
.row .ao{color:var(--muted);font:400 var(--fs-body) var(--font-mono);font-variant-numeric:tabular-nums}
.row .scr{color:var(--muted);font:400 var(--fs-body) var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.row .note{display:block;color:var(--warn);font:400 var(--fs-small) var(--font-ui);margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.row .when{color:var(--muted);font-size:var(--fs-body);white-space:nowrap}
.row .when b{color:var(--ink);font-weight:500}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px}
.row .tools-r{display:flex;align-items:center;justify-content:flex-end;gap:6px;opacity:0;transition:opacity .12s}
.row:hover .tools-r,.row.sel .tools-r,.row:focus-within .tools-r{opacity:1}
@media (hover:none){.row .tools-r{opacity:1}}
.pen{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;background:var(--paper)}
.pen button{padding:5px 8px;font-size:var(--fs-small);font-weight:600;color:var(--muted)}
.pen button:hover{color:var(--ink);background:var(--hover)}
.pen button.on{background:var(--solid);color:var(--solid-fg)}
.mini{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;color:var(--muted)}
.mini:hover{background:var(--surface-2);color:var(--ink)}
.mini.del:hover{color:var(--danger)}
.more{height:90px;display:grid;place-items:center;color:var(--muted);font-size:var(--fs-small)}
.empty{display:grid;place-items:center;gap:6px;padding:90px 0;text-align:center}
.empty b{font:500 22px var(--font-head)}
.empty p{margin:0 0 10px;color:var(--muted);font-size:var(--fs-lead)}
/* ───── toast / hud ───── */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:14px;background:var(--paper);border:1px solid var(--line-strong);box-shadow:var(--shadow);font-size:var(--fs-body);opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.hud{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;flex-direction:column;gap:8px;align-items:flex-end;font:500 12px/1 "DM Sans",sans-serif}
.hud .panel{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:16px;background:color-mix(in srgb,var(--paper) 92%,transparent);border:1px solid var(--line-strong);box-shadow:var(--shadow);backdrop-filter:blur(10px);min-width:250px}
.hud .panel[hidden]{display:none}
.hud label{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted)}
.hud .seg{height:30px;border-radius:9px}
.hud .seg button{padding:0 10px;font-size:12px;border-radius:7px}
.hud .toggle{height:38px;padding:0 14px;border-radius:19px;background:var(--solid);color:var(--solid-fg);font-weight:700;box-shadow:var(--shadow)}
.before{display:none;margin-top:18px}
.before img{width:100%;border-radius:16px;border:1px solid var(--line-strong);display:block}
.before p{color:var(--muted);font-size:14px;margin:12px 2px}
body.show-before .before{display:block}
body.show-before .after{display:none}
@media (max-width:1180px){.cols,.row{grid-template-columns:64px 130px 100px minmax(120px,1fr) 150px}.cols>:last-child,.row .tools-r{display:none}}
@media (max-width:760px){.cols{display:none}.row{grid-template-columns:56px 110px 1fr;height:auto;min-height:var(--row-h);padding:10px 12px}.row .ao,.row .scr,.row .when{display:none}.page{padding-top:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function recompute(){ // current personal best + ao5
  const best=Math.min(...data.map(val));data.forEach((s,i)=>{const v=val(s);s.pb=v===best;
    if(i<4){s.ao=null;return}const w=data.slice(i-4,i+1).map(val).sort((a,b)=>a-b);s.ao=w[3]===Infinity?Infinity:(w[1]+w[2]+w[3])/3})
}
recompute();
/* ───────── state ───────── */
const S={q:"",filter:"all",range:"any",from:"",to:"",sort:"date",dir:"desc",sel:null,limit:80};
const isoDay=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const searchText=new Map(); const hay=s=>{let h=searchText.get(s.id);if(h===undefined||h.pen!==s.pen||h.note!==s.note){h={pen:s.pen,note:s.note,v:(fmt(val(s))+" "+s.scr+" "+s.note+" "+s.pen).toLowerCase()};searchText.set(s.id,h)}return h.v};
function dateBounds(){
  if(S.range==="today")return[isoDay(now),isoDay(now)];
  if(S.range==="7")return[isoDay(now-6*DAY),isoDay(now)];
  if(S.range==="30")return[isoDay(now-29*DAY),isoDay(now)];
  if(S.range==="custom")return[S.from,S.to];return["",""]}
function results(){
  const q=S.q.trim().toLowerCase(),[a,b]=dateBounds();
  let r=data.filter(s=>{
    if(q&&!hay(s).includes(q))return false;
    if(S.filter==="sub"&&!(val(s)<10000))return false;
    if(S.filter==="plus"&&s.pen!=="+2")return false;
    if(S.filter==="dnf"&&s.pen!=="DNF")return false;
    if(a||b){const d=isoDay(s.t);if(a&&d<a)return false;if(b&&d>b)return false}
    return true});
  const k=S.dir==="desc"?-1:1;
  if(S.sort==="time")r.sort((x,y)=>(val(x)-val(y))*(S.dir==="desc"?1:-1)||x.n-y.n);
  else r.sort((x,y)=>(x.n-y.n)*k);
  return r}
/* ───────── rendering ───────── */
const hl=(text,q)=>{if(!q)return esc(text);const i=text.toLowerCase().indexOf(q);return i<0?esc(text):esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length))};
const timeOf=t=>new Date(t).toLocaleTimeString("en",{hour:"numeric",minute:"2-digit"});
function dayLabel(t){const d=isoDay(t);if(d===isoDay(now))return"Today";if(d===isoDay(now-DAY))return"Yesterday";return new Date(t).toLocaleDateString("en",{weekday:"long",month:"short",day:"numeric"})}
function whenCell(t,grouped){if(grouped)return`<b>${timeOf(t)}</b>`;const d=isoDay(t);const day=d===isoDay(now)?"Today":d===isoDay(now-DAY)?"Yesterday":new Date(t).toLocaleDateString("en",{month:"short",day:"numeric"});return`<b>${day}</b> · ${timeOf(t)}`}
const IC={copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>',del:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>'};
function rowHTML(s,q){
  const v=val(s),t=s.pen==="DNF"?"DNF":fmt(v);
  return`<div class="row${s.pen==="DNF"?" dnf":""}${s.pb?" best":""}${S.sel===s.id?" sel":""}" data-id="${s.id}" tabindex="0">
    <span class="no">#${s.n}</span>
    <span class="time">${hl(t,q)}${s.pen==="+2"?"<small>+2</small>":""}</span>
    <span class="ao">${s.ao==null?"–":fmt(s.ao)}</span>
    <span class="scr" title="${esc(s.scr)}">${hl(s.scr,q)}${s.note?`<span class="note">${hl(s.note,q)}</span>`:""}</span>
    <span class="when">${whenCell(s.t,S.sort==="date")}</span>
    <span class="tools-r"><span class="pen">${["","+2","DNF"].map(p=>`<button data-pen="${p}" class="${s.pen===p?"on":""}">${p||"OK"}</button>`).join("")}</span><button class="mini" data-act="copy" aria-label="Copy scramble" title="Copy scramble">${IC.copy}</button><button class="mini del" data-act="del" aria-label="Delete solve" title="Delete">${IC.del}</button></span>
  </div>`}
let current=[];
function paintList(){
  const q=S.q.trim().toLowerCase(),list=$("#list");
  if(!current.length){list.innerHTML=`<div class="empty"><b>${S.q?`No solves match “${esc(S.q.trim())}”`:"No solves here"}</b><p>${S.q?"Try a time like 9.8, a move like R2, or a word from a note.":"Nothing fits these filters."}</p><button class="btn ghost" id="emptyReset">Reset filters</button></div>`;return}
  const shown=current.slice(0,S.limit),byDay=S.sort==="date";let html="",lastDay="",group=null;
  const flush=()=>{};
  if(byDay){
    // day headers with a one-line summary, computed over the whole result so the numbers stay honest
    const stats={};current.forEach(s=>{const d=isoDay(s.t),g=stats[d]||(stats[d]={n:0,best:Infinity,sum:0,ok:0});g.n++;const v=val(s);if(Number.isFinite(v)){g.best=Math.min(g.best,v);g.sum+=v;g.ok++}});
    for(const s of shown){const d=isoDay(s.t);if(d!==lastDay){lastDay=d;const g=stats[d];html+=`<div class="day"><b>${dayLabel(s.t)}</b><span>${g.n} solve${g.n>1?"s":""}${g.ok?` · best ${fmt(g.best)} · mean ${fmt(g.sum/g.ok)}`:""}</span></div>`}html+=rowHTML(s,q)}
  }else for(const s of shown)html+=rowHTML(s,q);
  if(current.length>shown.length)html+=`<div class="more" id="more">Showing ${shown.length.toLocaleString()} of ${current.length.toLocaleString()} · keep scrolling</div>`;
  list.innerHTML=html}
function paintMeta(){
  const total=data.length,n=current.length,active=S.q||S.filter!=="all"||S.range!=="any";
  $("#count").innerHTML=active?`<b>${n.toLocaleString()}</b> of ${total.toLocaleString()} solves`:`<b>${total.toLocaleString()}</b> solves`;
  $("#reset").hidden=!active;$("#searchBox").classList.toggle("has",!!S.q);
  const lbl={any:"Any time",today:"Today",7:"Last 7 days",30:"Last 30 days"}[S.range]||(S.from||S.to?`${S.from||"…"} → ${S.to||"…"}`:"Any time");
  $("#dateLabel").textContent=lbl;$("#dateBtn").classList.toggle("on",S.range!=="any");
  $$("#filters button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.filter));
  $("#whenHead").textContent=S.sort==="date"?"At":"Recorded";$$("#cols .sortable").forEach(b=>{const on=b.dataset.sort===S.sort;b.classList.toggle("on",on);b.classList.toggle("asc",on&&S.dir==="asc")});
}
function paintSummary(){
  const ok=data.map(val).filter(Number.isFinite),best=Math.min(...ok),mean=ok.reduce((a,b)=>a+b,0)/ok.length;
  $("#summary").innerHTML=`<div class="stat"><b>${data.length.toLocaleString()}</b><span>solves</span></div><div class="stat best"><b>${fmt(best)}</b><span>best</span></div><div class="stat"><b>${fmt(mean)}</b><span>mean</span></div><div class="stat"><b>${data.filter(s=>s.pen==="DNF").length}</b><span>DNF</span></div>`}
let updates=0;
function update(keepLimit){ // the only place the list is repainted — in place, never the whole page
  if(!keepLimit)S.limit=80;
  current=results();paintMeta();paintList();updates++}
/* ───────── controls ───────── */
$("#filters").innerHTML=[["all","All"],["sub","Sub 10"],["plus","+2"],["dnf","DNF"]].map(([v,t])=>`<button data-v="${v}">${t}</button>`).join("");
$("#filters").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.filter=b.dataset.v;update()};
let timer;const q=$("#q");
q.addEventListener("input",()=>{ // 140 ms after the last key: one repaint of the rows, focus and caret never move
  clearTimeout(timer);$("#searchBox").classList.toggle("has",!!q.value);
  timer=setTimeout(()=>{S.q=q.value;update()},140)});
q.addEventListener("focus",()=>$("#searchBox").classList.add("focus"));q.addEventListener("blur",()=>$("#searchBox").classList.remove("focus"));
$("#clearQ").onclick=()=>{q.value="";S.q="";update();q.focus()};
$("#reset").onclick=resetAll;
function resetAll(){S.q="";q.value="";S.filter="all";S.range="any";S.from=S.to="";$("#from").value=$("#to").value="";update()}
document.addEventListener("click",e=>{
  if(e.target.id==="emptyReset")resetAll();
  const m=$("#moreMenu"),d=$("#datePop");
  if(e.target.closest("#moreBtn"))m.classList.toggle("open");else if(!e.target.closest("#moreMenu"))m.classList.remove("open");
  if(e.target.closest("#dateBtn"))d.classList.toggle("open");else if(!e.target.closest("#datePop"))d.classList.remove("open");
  const mb=e.target.closest("#moreMenu button");if(mb){m.classList.remove("open");toast(mb.dataset.m==="export"?"Your CSV would download now":"Opens category manager")}
  const db=e.target.closest("#datePop button[data-d]");if(db){S.range=db.dataset.d;S.from=S.to="";$("#from").value=$("#to").value="";d.classList.remove("open");update()}
});
for(const id of["from","to"])$("#"+id).addEventListener("change",()=>{S.from=$("#from").value;S.to=$("#to").value;S.range=(S.from||S.to)?"custom":"any";update()});
$("#add").onclick=()=>toast("Opens manual entry");
$("#cols").onclick=e=>{const b=e.target.closest(".sortable");if(!b)return;const k=b.dataset.sort;if(S.sort===k)S.dir=S.dir==="desc"?"asc":"desc";else{S.sort=k;S.dir=k==="time"?"asc":"desc"}update()};
/* rows: select, quick penalty, copy, delete with undo */
$("#list").addEventListener("click",e=>{
  const row=e.target.closest(".row");if(!row)return;const s=data.find(x=>x.id===row.dataset.id);
  const pen=e.target.closest("[data-pen]");
  if(pen){s.pen=pen.dataset.pen;recompute();paintSummary();update(true);return}
  const act=e.target.closest("[data-act]");
  if(act&&act.dataset.act==="copy"){navigator.clipboard?.writeText(s.scr).catch(()=>{});toast("Scramble copied");return}
  if(act&&act.dataset.act==="del"){const i=data.indexOf(s);data.splice(i,1);recompute();paintSummary();update(true);toast(`Solve #${s.n} deleted`,()=>{data.splice(i,0,s);recompute();paintSummary();update(true)});return}
  S.sel=s.id;$$(".row.sel").forEach(r=>r.classList.remove("sel"));row.classList.add("sel");toast(`Opens solve #${s.n} (the detail you already have)`)});
/* infinite scroll */
new IntersectionObserver(es=>{if(es.some(x=>x.isIntersecting)&&S.limit<current.length){S.limit+=120;paintList()}},{rootMargin:"900px"}).observe((()=>{const s=document.createElement("div");s.style.height="1px";$("#list").after(s);return s})());
/* keyboard: / search, Esc clears, arrows move through rows, Enter opens */
document.addEventListener("keydown",e=>{
  const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if(e.key==="/"&&!typing){e.preventDefault();q.focus();q.select()}
  else if(e.key==="Escape"){if(typing&&document.activeElement===q){if(q.value){q.value="";S.q="";update()}else q.blur()}$("#moreMenu").classList.remove("open");$("#datePop").classList.remove("open")}
  else if((e.key==="ArrowDown"||e.key==="ArrowUp")&&(!typing||document.activeElement===q)){
    const rows=$$(".row");if(!rows.length)return;e.preventDefault();let i=rows.indexOf(document.activeElement);
    i=e.key==="ArrowDown"?Math.min(rows.length-1,i+1):Math.max(0,i<0?0:i-1);rows[i].focus({preventScroll:false});rows[i].scrollIntoView({block:"nearest"})}
  else if(e.key==="Enter"&&document.activeElement.classList?.contains("row"))document.activeElement.click();
});
let tt,undoFn=null;
function toast(msg,undo){clearTimeout(tt);$("#toastMsg").textContent=msg;undoFn=undo||null;$("#toastUndo").style.display=undo?"":"none";$("#toast").classList.add("show");tt=setTimeout(()=>$("#toast").classList.remove("show"),undo?5200:2200)}
$("#toastUndo").onclick=()=>{undoFn?.();$("#toast").classList.remove("show")};
/* ───────── compare panel (demo only) ───────── */
const root=document.documentElement;
$("#hudBtn").onclick=()=>$("#hudPanel").hidden=!$("#hudPanel").hidden;
function seg(id,fn){$(id).onclick=e=>{const b=e.target.closest("button");if(!b)return;$$(id+" button").forEach(x=>x.classList.toggle("on",x===b));fn(b.dataset.v)}}
seg("#hView",v=>document.body.classList.toggle("show-before",v==="before"));
seg("#hSize",v=>root.dataset.size=v);
seg("#hFont",v=>root.dataset.font=v==="dm"?"":v);
seg("#hTheme",v=>root.dataset.theme=v);
root.dataset.size="easy";root.dataset.font="inter";
paintSummary();update();
window.__demo={get updates(){return updates},S};
</script>
